<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Shippori+Mincho+B1:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<!--
  Cellar v3（2026-10-10）。設計図 §14。v2 の画面は _v2_index.html に残してある。
  3つの層：
    仕事          … スケジュール（今日のタイムライン＋時間の決まっていないもの）とアイデア（話題＋メモ）。絵・写真・カミーユの姿は出さない
    プライベート   … 絵画を背景に、時刻・カミーユのひとこと・豆知識。時間帯で光が変わり、ゆっくり動く。「書く」は ためた話 → 毎晩 Obsidian へ
    カミーユの部屋 … 秘密の合図の内側だけ。姿の絵・夜の話・部屋のことば・音楽・お買いもの・趣味・パイプは、合図が合ったときだけ GAS から読む。
                    **この HTML には部屋の中身を置かない**（公開ページに載るため）
  合図：プライベートで時計を3回続けて押す／キーボードで camille と打つ → 名前のない欄に合図（ROOM_KEY）を入れて Enter
  3経路通信（モック／GAS 配信／GitHub Pages の JSONP）は v2 と同じ。長いメモだけ POST（kind=api）
-->
<style>
:root {
  --paper: #EEF1EE; --sheet: #F8FAF8; --ink: #1D2622; --muted: #5F6C66; --rule: #CDD5D0;
  --bottle: #2E5A4C; --amber: #A86A12; --late: #9A3B2E; --steel: #4A6FA5; --plum: #8A5A86;
  --ivory: #EFE8DA; --ivory-dim: rgba(239, 232, 218, .72);
  --gothic: "Zen Kaku Gothic New", system-ui, sans-serif;
  --mincho: "Shippori Mincho B1", "Yu Mincho", serif;
  --numeral: "Cormorant Garamond", "Shippori Mincho B1", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161B19; --sheet: #1D2421; --ink: #E3E8E5; --muted: #98A39E; --rule: #334039;
    --bottle: #7FB5A2; --amber: #D9A24A; --late: #E08B7D; --steel: #8DAAD6; --plum: #C49BC0;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--gothic); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--bottle); outline-offset: 2px; }
.house { position: fixed; inset: 0; overflow: auto; transition: opacity 1.2s ease, visibility 0s linear 1.2s; opacity: 0; visibility: hidden; }
body[data-house="work"] #work, body[data-house="private"] #private, body[data-house="room"] #room { opacity: 1; visibility: visible; transition: opacity 1.2s ease, visibility 0s; }

/* ───────── 切り替え ───────── */
.switch { position: fixed; z-index: 20; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(29, 38, 34, .08); transition: opacity .8s ease, background .8s ease; }
.switch button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.switch button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); font-weight: 500; }
body[data-house="private"] .switch { background: rgba(0, 0, 0, .28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
body[data-house="private"] .switch button { color: var(--ivory-dim); }
body[data-house="private"] .switch button[aria-pressed="true"] { background: rgba(239, 232, 218, .16); color: var(--ivory); }
body.idle[data-house="private"] .switch, body.idle[data-house="private"] .pv-quiet { opacity: 0; }
body[data-house="room"] .switch { display: none; }

/* ───────── 合言葉 ───────── */
.gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--paper); padding: 16px; }
.gate form { width: min(360px, 100%); }
.gate h1 { font: 500 22px var(--gothic); margin: 0 0 4px; }
.gate p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.gate .err { color: var(--late); }
.gate input { width: 100%; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); padding: 10px 12px; font-size: 16px; }
.gate button { margin-top: 10px; width: 100%; }

/* ───────── 仕事 ───────── */
#work { padding: 72px 16px 40px; }
.w-wrap { max-width: 1080px; margin: 0 auto; }
.w-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.w-date { font-size: 26px; font-weight: 500; letter-spacing: .02em; }
.w-date small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.w-wx { color: var(--muted); font-size: 14px; }
.w-cam { margin: 14px 0 22px; color: var(--muted); font-size: 14px; }
.w-cam b { color: var(--bottle); font-weight: 500; margin-right: 8px; }
.w-nav { display: flex; gap: 20px; margin: 0 0 22px; border-bottom: 1px solid var(--rule); }
.w-nav button { border: 0; background: none; padding: 8px 0 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.w-nav button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 500; }
.w-sec h2 { font-size: 15px; font-weight: 700; margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; }
.w-sec h2 .n { font-weight: 400; color: var(--muted); font-size: 13px; }
.w-sec + .w-sec { margin-top: 26px; }
.state { color: var(--muted); font-size: 14px; margin: 6px 0; }
.state.err { color: var(--late); }
.link { border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--bottle); font-size: 13px; }
.link:hover { text-decoration: underline; }
.act { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
.act:hover { border-color: var(--bottle); color: var(--bottle); }
.busy { opacity: .45; pointer-events: none; }

/* 時間の決まっていないもの（右の欄）：行は チェック｜題名｜操作 */
.yours { background: var(--sheet); border-left: 3px solid var(--bottle); padding: 2px 14px; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); align-items: center; }
.row:first-child { border-top: 0; }
.row.nochk { grid-template-columns: minmax(0, 1fr) auto; }
.row .ttl { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
a.ttl:hover { text-decoration: underline; }
.row .m { display: block; font-size: 12px; color: var(--muted); }
.row .m .other { color: var(--amber); font-weight: 500; }
.row .m .late { color: var(--late); }
.chk { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; background: transparent; cursor: pointer; padding: 0; }
.chk:hover { border-color: var(--bottle); background: color-mix(in srgb, var(--bottle) 12%, transparent); }
.row.done .ttl { text-decoration: line-through; color: var(--muted); }
.sysdot { width: 8px; height: 8px; border-radius: 50%; justify-self: center; background: var(--amber); }
.sysdot.st-stop { background: var(--late); }
.rt { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 0 10px; padding: 9px 0; border-top: 1px solid var(--rule); align-items: center; }
.rt:first-child { border-top: 0; }
.rt .s { font-size: 12px; color: var(--muted); }
.rt.late .s { color: var(--late); font-weight: 500; }
.rt.done { color: var(--muted); }
.rt.done .t { text-decoration: line-through; text-decoration-color: var(--rule); }
.rt .hint { display: block; font-size: 12px; color: var(--muted); }
.time { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
.time:first-child { border-top: 0; }
.time .h { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.more { margin-top: 6px; }

/* スケジュール：縦のタイムライン。1時間＝56px。種類は左の色 */
.sched { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 32px 44px; }
@media (max-width: 860px) { .sched { grid-template-columns: 1fr; } }
.allday { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px 52px; }
.allday a, .allday span { font-size: 13px; padding: 2px 12px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--rule); text-decoration: none; }
.tl { position: relative; margin-left: 52px; border-left: 1px solid var(--rule); }
.tl .hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule); opacity: .55; }
.tl .hr span { position: absolute; left: -52px; top: -.8em; width: 40px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .hr.half { border-top-style: dotted; opacity: .35; }
.ev { position: absolute; z-index: 1; padding: 5px 10px 5px 12px; border-left: 3px solid var(--k, var(--bottle)); background: var(--sheet); border-radius: 0 6px 6px 0; overflow: hidden; font-size: 14px; line-height: 1.45; text-decoration: none; }
a.ev:hover .ttl { text-decoration: underline; }
.ev .when { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .who { display: block; font-size: 12px; color: var(--muted); }
.ev.short { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; padding-top: 3px; padding-bottom: 3px; }
.ev.short .when { display: inline; flex: none; }
.ev.short .ttl { overflow: hidden; text-overflow: ellipsis; }
.ev.past { opacity: .5; }
.ev.cur { box-shadow: inset 0 0 0 1px var(--k); }
.ev.cur .ttl { font-weight: 700; }
.k-meet { --k: var(--bottle); } .k-guest { --k: var(--amber); } .k-make { --k: var(--steel); } .k-shop { --k: var(--plum); } .k-task { --k: var(--muted); }
.nowl { position: absolute; left: -5px; right: 0; border-top: 2px solid var(--late); z-index: 0; pointer-events: none; }
.nowl::before { content: ""; position: absolute; left: -4px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--late); }
.nowl span { position: absolute; left: -49px; width: 42px; top: -.8em; text-align: right; font-size: 12px; line-height: 1.5; color: var(--late); font-weight: 700; background: var(--paper); font-variant-numeric: tabular-nums; }
.tl-empty { margin-left: 52px; }

/* アイデア */
.ideas { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px 44px; }
@media (max-width: 860px) { .ideas { grid-template-columns: 1fr; } }
.topics-head { display: flex; justify-content: space-between; align-items: baseline; }
.topics-head h2, .memo h2 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
#topics { list-style: none; margin: 0; padding: 0; columns: 2 16em; column-gap: 28px; }
#topics li { break-inside: avoid; padding: 14px 0 16px; border-top: 1px solid var(--rule); }
#topics .kind { font-size: 12px; color: var(--muted); }
#topics .kind b { font-weight: 500; color: var(--d); margin-right: 8px; }
.d-near { --d: var(--bottle); } .d-mid { --d: var(--steel); } .d-far { --d: var(--plum); }
#topics h3 { font-size: 16px; font-weight: 500; margin: 2px 0 4px; line-height: 1.5; }
#topics p { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
.memo textarea { width: 100%; resize: vertical; min-height: 7em; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); font: 15px/1.7 var(--gothic); padding: 10px 12px; }
.memo textarea:focus { outline: 2px solid var(--bottle); outline-offset: 0; border-color: transparent; }
.ref { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--bottle); margin-bottom: 6px; }
.memo-act { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.memo-act .hint { font-size: 12px; color: var(--muted); }
.save { border: 0; background: var(--bottle); color: #fff; border-radius: 6px; padding: 7px 18px; cursor: pointer; font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .save { color: #10201A; } }
.memos { list-style: none; margin: 22px 0 0; padding: 0; }
.memos li { padding: 12px 0; border-top: 1px solid var(--rule); }
.memos .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.memos .body { white-space: pre-wrap; margin-top: 2px; overflow-wrap: anywhere; }
.memos .of { font-size: 12px; color: var(--bottle); }
.memos .empty { color: var(--muted); font-size: 14px; border: 0; }
.pulse { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); }
.pulse span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bottle); margin-right: 6px; vertical-align: 1px; }
.pulse span.st-late::before { background: var(--amber); }
.pulse span.st-stop::before { background: var(--late); }
.pulse span.st-none::before { background: transparent; border: 1px solid var(--muted); }
.pulse .stamp { margin-left: auto; }
.pulse .stamp::before { display: none; }

/* ───────── プライベート ───────── */
#private { overflow: hidden; overflow: clip; background: #0E0D0C; color: var(--ivory); }
.art { position: absolute; inset: -4%; background-size: cover; background-position: center; opacity: 0; transition: opacity 6s ease;
  animation: drift 150s ease-in-out infinite alternate; will-change: transform, opacity; filter: saturate(var(--sat, .9)) brightness(var(--bri, .8)); }
.art.on { opacity: 1; }
@keyframes drift { from { transform: scale(1.04) translate(-1.2%, .6%); } to { transform: scale(1.14) translate(1.4%, -1%); } }
#mood { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; pointer-events: none; }
.veil { position: absolute; inset: 0; pointer-events: none; transition: background 4s ease;
  background: radial-gradient(28% 55% at 90% 36%, rgba(6, 6, 8, .42), transparent 100%),
              radial-gradient(34% 40% at 14% 22%, rgba(6, 6, 8, .32), transparent 100%),
              radial-gradient(120% 90% at 20% 30%, transparent 0 40%, var(--veil, rgba(8, 10, 20, .55)) 100%),
              linear-gradient(to top, rgba(6, 6, 8, .78), transparent 46%); }
.tint { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; background: var(--tint, transparent); transition: background 4s ease; }
.pv { position: absolute; inset: 0; }
.clock { position: absolute; left: clamp(16px, 5vw, 64px); top: clamp(70px, 12vh, 120px); cursor: default; user-select: none; -webkit-user-select: none; }
.clock .hm { font-family: var(--numeral); font-weight: 300; font-size: clamp(72px, 13vw, 156px); line-height: .9; letter-spacing: .01em; text-shadow: 0 2px 30px rgba(0, 0, 0, .35); font-variant-numeric: lining-nums; }
.clock .hm i { font-style: normal; opacity: .55; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }
.clock .dt { font-family: var(--mincho); font-size: 15px; color: var(--ivory-dim); margin-top: 10px; letter-spacing: .08em; }
.dayline { position: relative; width: min(340px, 64vw); height: 18px; margin-top: 18px; }
.dayline::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: rgba(239, 232, 218, .22); }
.dayline .sun { position: absolute; top: 7px; height: 3px; border-radius: 2px; background: rgba(239, 232, 218, .5); }
.dayline .now { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--ivory); box-shadow: 0 0 14px 4px rgba(255, 226, 170, .45); transition: left 1s linear; }
.dayline .lb { position: absolute; top: 18px; font-size: 11px; color: var(--ivory-dim); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.secret { margin-top: 26px; height: 0; overflow: hidden; transition: height .5s ease; }
.secret.open { height: 44px; }
.secret input { width: 180px; background: transparent; border: 0; border-bottom: 1px solid rgba(239, 232, 218, .4); color: var(--ivory); font: 16px var(--mincho); padding: 6px 2px; outline: none; letter-spacing: .3em; }
.secret.shake input { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.cam { position: absolute; right: clamp(20px, 6vw, 88px); top: clamp(80px, 13vh, 140px); writing-mode: vertical-rl; margin: 0;
  font-family: var(--mincho); font-size: clamp(17px, 1.6vw, 22px); line-height: 2.1; letter-spacing: .14em; max-height: min(62vh, 30em);
  text-shadow: 0 1px 18px rgba(0, 0, 0, .55); transition: opacity 2.4s ease; }
.cam .who { display: block; font-size: 12px; letter-spacing: .3em; color: var(--ivory-dim); margin-left: 1.2em; }
.cam.fade, .trivia.fade { opacity: 0; }
.trivia { position: absolute; left: clamp(16px, 5vw, 64px); bottom: max(34px, env(safe-area-inset-bottom)); max-width: min(34em, calc(100vw - 32px)); transition: opacity 1.6s ease; }
.trivia h3 { font-family: var(--mincho); font-weight: 500; font-size: 16px; margin: 0 0 6px; letter-spacing: .06em; }
.trivia p { margin: 0; font-size: 14px; line-height: 1.85; }
.trivia p.th { font-family: var(--mincho); color: var(--ivory-dim); margin-top: 6px; }
.trivia .src { font-size: 12px; color: var(--ivory-dim); }
.pvlink { margin-top: 10px; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--ivory-dim); font-size: 13px; border-bottom: 1px solid rgba(239, 232, 218, .3); }
.pvlink:hover { color: var(--ivory); }
.artcap { position: absolute; right: clamp(16px, 5vw, 64px); bottom: max(34px, env(safe-area-inset-bottom)); text-align: right; font-family: var(--mincho); font-size: 13px; color: var(--ivory-dim); max-width: 22em; transition: opacity .8s ease; }
.artcap button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; font: inherit; text-align: right; }
.artcap .talk { display: none; margin-top: 8px; color: var(--ivory); line-height: 1.85; text-align: left; }
.artcap.open .talk { display: block; }
.pv-tools { position: absolute; right: clamp(16px, 5vw, 64px); bottom: calc(max(34px, env(safe-area-inset-bottom)) + 62px); display: flex; gap: 18px; transition: opacity .8s ease; }
.pv-tools button { border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--ivory); font: 15px var(--mincho); letter-spacing: .1em; border-bottom: 1px solid rgba(239, 232, 218, .45); }
.glass { position: fixed; z-index: 30; visibility: hidden; background: rgba(14, 12, 10, .62); backdrop-filter: blur(18px) saturate(.9); -webkit-backdrop-filter: blur(18px) saturate(.9); color: var(--ivory);
  transition: transform .6s cubic-bezier(.2, .7, .2, 1), opacity .6s ease, visibility 0s linear .6s; }
.glass.open { visibility: visible; transition: transform .6s cubic-bezier(.2, .7, .2, 1), opacity .6s ease, visibility 0s; }
.sheet { left: 50%; bottom: 0; width: min(640px, 100%); transform: translate(-50%, 100%); opacity: 0; border-radius: 14px 14px 0 0; padding: 20px 22px max(20px, env(safe-area-inset-bottom)); }
.sheet.open { transform: translate(-50%, 0); opacity: 1; }
.sheet textarea { width: 100%; min-height: 8.5em; resize: vertical; background: transparent; border: 0; border-bottom: 1px solid rgba(239, 232, 218, .3); color: var(--ivory); font: 17px/2 var(--mincho); letter-spacing: .04em; padding: 4px 2px; outline: none; }
.sheet textarea::placeholder { color: rgba(239, 232, 218, .45); }
.sheet .row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ivory-dim); }
.sheet label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.pill { border: 1px solid rgba(239, 232, 218, .35); background: none; color: var(--ivory); border-radius: 999px; padding: 6px 18px; cursor: pointer; font: 14px var(--mincho); }
.pill.keep { background: rgba(239, 232, 218, .9); color: #1A1714; border-color: transparent; }
.drawer { top: 0; right: 0; bottom: 0; width: min(420px, 100%); transform: translateX(100%); opacity: 0; padding: max(64px, env(safe-area-inset-top)) 24px 24px; overflow: auto; }
.drawer.open { transform: none; opacity: 1; }
.drawer h2 { font: 500 18px var(--mincho); letter-spacing: .12em; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
.drawer h2 button, .talks .x { border: 0; background: none; color: var(--ivory-dim); cursor: pointer; font: 13px var(--gothic); padding: 0; }
.drawer .note { font-size: 12px; color: var(--ivory-dim); margin: 0 0 16px; }
.talks { list-style: none; margin: 0; padding: 0; }
.talks li { padding: 14px 0; border-top: 1px solid rgba(239, 232, 218, .16); }
.talks .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ivory-dim); }
.talks .body { font: 15px/1.95 var(--mincho); white-space: pre-wrap; margin-top: 4px; overflow-wrap: anywhere; }

<script>

  {"title": "夜のカフェテラス", "who": "フィンセント・ファン・ゴッホ", "year": "1888", "where": "クレラー・ミュラー美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Van_Gogh_-_Terrace_of_a_Caf%C3%A9_at_Night_%28Place_du_Forum%29_1888.jpg/960px-Van_Gogh_-_Terrace_of_a_Caf%C3%A9_at_Night_%28Place_du_Forum%29_1888.jpg", "page": "https://commons.wikimedia.org/wiki/File:Van_Gogh_-_Terrace_of_a_Caf%C3%A9_at_Night_(Place_du_Forum)_1888.jpg", "talk": "黒を使わずに夜を描いた、と本人が妹への手紙に書いています。青と紫と緑だけで夜は作れるそうです。暗い話ほど黒を使いたくなるものですけどね。"},
  {"title": "花咲くアーモンドの木の枝", "who": "フィンセント・ファン・ゴッホ", "year": "1890", "where": "ファン・ゴッホ美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Vincent_van_Gogh_-_Almond_blossom_-_Google_Art_Project.jpg/960px-Vincent_van_Gogh_-_Almond_blossom_-_Google_Art_Project.jpg", "page": "https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_Almond_blossom_-_Google_Art_Project.jpg", "talk": "弟テオに息子が生まれたお祝いに描いた一枚です。赤ちゃんの名前はフィンセント、伯父の名前をもらいました。お祝いは、これくらい静かなのがいいですね。"},
  {"title": "神奈川沖浪裏（富嶽三十六景）", "who": "葛飾北斎", "year": "1831年ごろ", "where": "", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Tsunami_by_hokusai_19th_century.jpg/960px-Tsunami_by_hokusai_19th_century.jpg", "page": "https://commons.wikimedia.org/wiki/File:Tsunami_by_hokusai_19th_century.jpg", "talk": "波の向こうの小さな山が富士山です。主役をいちばん小さく描くのは、度胸がいりますね。ドビュッシーはこの絵を、交響詩『海』の楽譜の表紙に使いました。"},
  {"title": "凱風快晴（富嶽三十六景）", "who": "葛飾北斎", "year": "1831年ごろ", "where": "", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/%E3%80%8C%E5%AF%8C%E5%B6%BD%E4%B8%89%E5%8D%81%E5%85%AD%E6%99%AF_%E5%87%B1%E9%A2%A8%E5%BF%AB%E6%99%B4%E3%80%8D-South_Wind%2C_Clear_Sky_%28Gaif%C5%AB_kaisei%29%2C_also_known_as_Red_Fuji%2C_from_the_series_Thirty-six_Views_of_Mount_Fuji_%28Fugaku_sanj%C5%ABrokkei%29_MET_DP141062.jpg/960px-thumbnail.jpg", "page": "https://commons.wikimedia.org/wiki/File:%E3%80%8C%E5%AF%8C%E5%B6%BD%E4%B8%89%E5%8D%81%E5%85%AD%E6%99%AF_%E5%87%B1%E9%A2%A8%E5%BF%AB%E6%99%B4%E3%80%8D-South_Wind,_Clear_Sky_(Gaif%C5%AB_kaisei),_also_known_as_Red_Fuji,_from_the_series_Thirty-six_Views_of_Mount_Fuji_(Fugaku_sanj%C5%ABrokkei)_MET_DP141062.jpg", "talk": "夏の終わりの早朝、朝日で山肌が赤く染まる一瞬だそうです。山と雲と空、それだけで足りている。書類も見習ってほしいものですね。"},
  {"title": "名所江戸百景 大はしあたけの夕立", "who": "歌川広重", "year": "1857", "where": "", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Utagawa_Hiroshige_-_Evening_Shower_at_Atake_and_the_Great_Bridge.jpg/960px-Utagawa_Hiroshige_-_Evening_Shower_at_Atake_and_the_Great_Bridge.jpg", "page": "https://commons.wikimedia.org/wiki/File:Utagawa_Hiroshige_-_Evening_Shower_at_Atake_and_the_Great_Bridge.jpg", "talk": "ゴッホがこれを油絵で模写しています。雨を細い線で描くという発想が、向こうには無かったんです。……急に降られて小走りの人たち、少しかわいいでしょう。"},
  {"title": "印象・日の出", "who": "クロード・モネ", "year": "1872", "where": "マルモッタン・モネ美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Monet_-_Impression%2C_Sunrise.jpg/960px-Monet_-_Impression%2C_Sunrise.jpg", "page": "https://commons.wikimedia.org/wiki/File:Monet_-_Impression,_Sunrise.jpg", "talk": "ル・アーヴルの港の朝です。批評家がこの題名をからかって『印象派』と呼んだのが、そのまま流派の名前になりました。悪口が看板になることもあるんですね。"},
  {"title": "睡蓮（連作より）", "who": "クロード・モネ", "year": "1920年ごろ", "where": "ニューヨーク近代美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Reflections_of_Clouds_on_the_Water-Lily_Pond.jpg/960px-Reflections_of_Clouds_on_the_Water-Lily_Pond.jpg", "page": "https://commons.wikimedia.org/wiki/File:Reflections_of_Clouds_on_the_Water-Lily_Pond.jpg", "talk": "ジヴェルニーの庭に池を掘って、晩年の30年ほどを睡蓮に使いました。作品は約250点。ひとつのことを続ける人の強さは、数字にすると分かりやすいですね。"},
  {"title": "真珠の耳飾りの少女", "who": "ヨハネス・フェルメール", "year": "1665年ごろ", "where": "マウリッツハイス美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/960px-1665_Girl_with_a_Pearl_Earring.jpg", "page": "https://commons.wikimedia.org/wiki/File:1665_Girl_with_a_Pearl_Earring.jpg", "talk": "肖像画ではなく、架空の人物の顔を描いた『トローニー』と呼ばれる習作です。モデルが誰かは分かっていません。分からないままのほうが、長く見ていられる気がします。"},
  {"title": "牛乳を注ぐ女", "who": "ヨハネス・フェルメール", "year": "1658年ごろ", "where": "アムステルダム国立美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/960px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "page": "https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "talk": "台所の一瞬なのに、パンの粒まで光っています。壁の釘や、釘が抜けたあとの穴まで描いてあるんですよ。細かいところを見ている人は、信用できますね。"},
  {"title": "モナ・リザ", "who": "レオナルド・ダ・ヴィンチ", "year": "1503年ごろ〜", "where": "ルーヴル美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/960px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg", "page": "https://commons.wikimedia.org/wiki/File:Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg", "talk": "1911年に盗まれて、2年ほど行方不明になりました。いなくなって世界中が騒いだことで、かえっていちばん有名な絵になった、とも言われます。"},
  {"title": "ヴィーナスの誕生", "who": "サンドロ・ボッティチェリ", "year": "1485年ごろ", "where": "ウフィツィ美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/960px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "page": "https://commons.wikimedia.org/wiki/File:Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "talk": "海の泡から生まれたヴィーナスが、貝殻に乗って岸に着くところです。首の長さや左肩の形は、現実にはありえない角度なんですよ。美しさのためなら、骨格は少し譲るものらしいです。"},
  {"title": "夜警", "who": "レンブラント・ファン・レイン", "year": "1642", "where": "アムステルダム国立美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg/960px-La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg", "page": "https://commons.wikimedia.org/wiki/File:La_ronda_de_noche,_por_Rembrandt_van_Rijn.jpg", "talk": "本当は昼の場面です。表面のニスが黒ずんで夜の絵だと思われ、この呼び名が付きました。汚れのせいで付いた名前が、そのまま残っているんです。"},
  {"title": "ラス・メニーナス（女官たち）", "who": "ディエゴ・ベラスケス", "year": "1656", "where": "プラド美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/960px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "page": "https://commons.wikimedia.org/wiki/File:Las_Meninas,_by_Diego_Vel%C3%A1zquez,_from_Prado_in_Google_Earth.jpg", "talk": "絵の中に、描いている最中の画家本人が立っています。奥の鏡に映っているのは国王夫妻。見ているわたしたちが、国王の立ち位置に立たされているんですね。"},
  {"title": "接吻", "who": "グスタフ・クリムト", "year": "1908年ごろ", "where": "ベルヴェデーレ宮殿", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg/960px-The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg", "page": "https://commons.wikimedia.org/wiki/File:The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg", "talk": "本物の金箔が使われています。ふたりの服の模様、男性は四角、女性は丸なんですよ。言葉がなくても分かるように描いてあります。"},
  {"title": "叫び", "who": "エドヴァルド・ムンク", "year": "1893", "where": "ノルウェー国立美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg/960px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg", "page": "https://commons.wikimedia.org/wiki/File:Edvard_Munch,_1893,_The_Scream,_oil,_tempera_and_pastel_on_cardboard,_91_x_73_cm,_National_Gallery_of_Norway.jpg", "talk": "叫んでいるのは描かれた人ではなく自然のほうで、この人は耳をふさいでいる、と本人が書き残しています。……月曜の朝に似合う一枚ですね。"},
  {"title": "グランド・ジャット島の日曜日の午後", "who": "ジョルジュ・スーラ", "year": "1884〜1886", "where": "シカゴ美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/A_Sunday_on_La_Grande_Jatte%2C_Georges_Seurat%2C_1884.jpg/960px-A_Sunday_on_La_Grande_Jatte%2C_Georges_Seurat%2C_1884.jpg", "page": "https://commons.wikimedia.org/wiki/File:A_Sunday_on_La_Grande_Jatte,_Georges_Seurat,_1884.jpg", "talk": "絵の具を混ぜずに、小さな点を並べて色を作っています。仕上げるのに2年ほど。のんびりした日曜の午後を、2年がかりで描いたわけですね。"},
  {"title": "ムーラン・ド・ラ・ギャレットの舞踏会", "who": "ピエール＝オーギュスト・ルノワール", "year": "1876", "where": "オルセー美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Renoir%2C_Pierre-Auguste_-_Dance_at_Le_Moulin_de_la_Galette%2C_1876.jpg/960px-Renoir%2C_Pierre-Auguste_-_Dance_at_Le_Moulin_de_la_Galette%2C_1876.jpg", "page": "https://commons.wikimedia.org/wiki/File:Renoir,_Pierre-Auguste_-_Dance_at_Le_Moulin_de_la_Galette,_1876.jpg", "talk": "モンマルトルの屋外ダンスホールの日曜日です。木漏れ日が服の上でまだらになっているでしょう。光を色の斑点で描こうとしていたころの一枚です。"},
  {"title": "フォリー・ベルジェールのバー", "who": "エドゥアール・マネ", "year": "1882", "where": "コートールド・ギャラリー", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%22Un_Bar_aux_Folies-Berg%C3%A8re%22_by_%C3%89douard_Manet_%281882%29.jpg/960px-%22Un_Bar_aux_Folies-Berg%C3%A8re%22_by_%C3%89douard_Manet_%281882%29.jpg", "page": "https://commons.wikimedia.org/wiki/File:%22Un_Bar_aux_Folies-Berg%C3%A8re%22_by_%C3%89douard_Manet_(1882).jpg", "talk": "カウンターの両端に、赤い三角のラベルのビール瓶が見えます。イギリスのバス・ペールエールです。140年以上前の名画に、ビールがちゃんと商品として写っている。うちの業界としては嬉しいですね。"},
  {"title": "落穂拾い", "who": "ジャン＝フランソワ・ミレー", "year": "1857", "where": "オルセー美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg/960px-Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg", "page": "https://commons.wikimedia.org/wiki/File:Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg", "talk": "刈り入れのあと、畑に落ちた穂を拾うことを許された女性たちです。発表当時、上流の人たちにはあまり評判がよくなかったそうです。見たくないものは、いつの時代も不人気ですね。"},
  {"title": "雲海の上の旅人", "who": "カスパー・ダーヴィト・フリードリヒ", "year": "1818年ごろ", "where": "ハンブルク美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg/960px-Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg", "page": "https://commons.wikimedia.org/wiki/File:Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg", "talk": "顔を見せない後ろ姿の人物は、フリードリヒの得意技です。見ているわたしたちが、そのまま霧の海を見下ろす側に立つことになる。遠くを見たい日には、ちょうどいいですよ。"},
  {"title": "干し草車", "who": "ジョン・コンスタブル", "year": "1821", "where": "ロンドン・ナショナル・ギャラリー", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/John_Constable_-_The_Hay_Wain_%281821%29.jpg/960px-John_Constable_-_The_Hay_Wain_%281821%29.jpg", "page": "https://commons.wikimedia.org/wiki/File:John_Constable_-_The_Hay_Wain_(1821).jpg", "talk": "地元のイギリスでは地味だと言われましたが、パリのサロンで金メダルをとって、ドラクロワたちを驚かせました。地元がいちばん見過ごす、というのはよくある話です。"},
  {"title": "雨、蒸気、速度", "who": "ウィリアム・ターナー", "year": "1844", "where": "ロンドン・ナショナル・ギャラリー", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/960px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "page": "https://commons.wikimedia.org/wiki/File:Turner_-_Rain,_Steam_and_Speed_-_National_Gallery_file.jpg", "talk": "開通して間もないグレート・ウェスタン鉄道です。線路の先をよく見ると、小さな野ウサギが走っています。機関車と競争しているのか、逃げているのか。"},
  {"title": "農民の婚宴", "who": "ピーテル・ブリューゲル（父）", "year": "1567年ごろ", "where": "ウィーン美術史美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Pieter_Bruegel_the_Elder_-_Peasant_Wedding_-_Google_Art_Project_2.jpg/960px-Pieter_Bruegel_the_Elder_-_Peasant_Wedding_-_Google_Art_Project_2.jpg", "page": "https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Peasant_Wedding_-_Google_Art_Project_2.jpg", "talk": "左手前の男性が、壺にビールを注いでいます。16世紀のフランドルの結婚式、主役のお酒はビールだったんですね。花婿がどの人なのかは、いまも議論が続いているそうです。"},
  {"title": "雪中の狩人", "who": "ピーテル・ブリューゲル（父）", "year": "1565", "where": "ウィーン美術史美術館", "img": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_%28Winter%29_-_Google_Art_Project.jpg/960px-Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_%28Winter%29_-_Google_Art_Project.jpg", "page": "https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter)_-_Google_Art_Project.jpg", "talk": "季節を描いた連作の、冬の一枚です。獲物は狐が1匹だけ。疲れた足取りの向こうで、村の人たちは氷の上で遊んでいます。冬の仕込みの季節に、ちょうどいい景色ですね。"},
